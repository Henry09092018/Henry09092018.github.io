                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (appState === 4) {
                renderProcessDetails();
            } else if (appState === 5) {
                detailsPaneElement.innerHTML = `
                    <h3 class="text-2xl font-bold text-teal-700 mb-6 border-b pb-2">
                        <i class="fa-solid fa-puzzle-piece mr-2"></i> List Software Freeware
                    </h3>
                    <div class="space-y-4">
                        <p class="text-gray-700 p-3 bg-teal-100 rounded-lg border border-teal-300 font-medium">
                            <i class="fa-solid fa-info-circle mr-2 text-teal-600"></i>
                            Vui lòng chọn một tài liệu dưới đây để xem chi tiết về quy định sử dụng phần mềm miễn phí.
                        </p>
                        ${freewareLists.map(f => `
                            <div class="p-4 bg-white rounded-lg shadow-md border-l-4 border-teal-400 hover:border-teal-600 transition cursor-pointer" onclick="displayFreewareDetails('${f.id}')">
                                <h4 class="text-lg font-bold text-gray-800">${f.name}</h4>
                                <p class="text-sm text-gray-600 mt-1">File gốc: <span class="font-semibold text-indigo-600">${f.form}</span></p>
                                <p class="text-xs text-teal-500 font-semibold mt-2 flex items-center">
                                    Xem Tài liệu PDF <i class="fa-solid fa-arrow-right ml-1 text-xs"></i>
                                </p>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (appState === 6) {
                renderFreewareDetails();
            }
        }
        
        function renderProcessDetails() {
            const process = signingProcesses.find(p => p.id === selectedProcessId);
            if (!process) {
                detailsPaneElement.innerHTML = '<p class="text-gray-500 italic">Không tìm thấy thông tin quy trình.</p>';
                return;
            }
            
            const hasForm = process.formPdfUrl && process.formOdtUrl;
            let formActionButtons = hasForm ? `
                <div class="flex flex-col space-y-3 mt-4">
                    <button onclick="showConfirmationModal('${process.formPdfUrl}', '${process.form}', true)" 
                            class="w-full text-lg font-bold text-white bg-indigo-600 hover:bg-indigo-700 transition duration-200 shadow-md flex items-center justify-center py-3 px-4 rounded-lg">
                        <i class="fa-solid fa-eye mr-3"></i> 1. Xem trước Biểu mẫu (PDF)
                    </button>
                    <button onclick="downloadOdtFile('${process.formOdtUrl}')" 
                            class="w-full text-lg font-bold text-gray-800 bg-yellow-400 hover:bg-yellow-500 transition duration-200 shadow-md flex items-center justify-center py-3 px-4 rounded-lg">
                        <i class="fa-solid fa-download mr-3"></i> 2. Tải xuống File Gốc (.ODT)
                    </button>
                </div>
            ` : `<p class="text-lg font-bold text-gray-600 italic">Không yêu cầu biểu mẫu đi kèm.</p>`;

            detailsPaneElement.innerHTML = `
                <button onclick="appState = 3; renderRightPane();" class="mb-6 text-blue-600 hover:text-blue-800 font-semibold transition duration-200 flex items-center p-2 rounded-lg bg-white shadow-sm hover:shadow-md">
                    <i class="fa-solid fa-chevron-left mr-2 text-sm"></i> Quay lại Danh sách Lưu trình
                </button>

                <div class="mb-6 pb-3 border-b-2 border-blue-400">
                    <p class="text-3xl font-extrabold text-blue-800 flex items-center">
                        <i class="fa-solid fa-scroll mr-3"></i> ${process.name}
                    </p>
                </div>
                
                <div class="space-y-6">
                    <div class="p-4 bg-white rounded-xl shadow-lg border-l-4 border-indigo-500">
                        <h4 class="text-xl font-bold text-indigo-700 mb-3 flex items-center"><i class="fa-solid fa-file-invoice mr-2"></i> Biểu Mẫu Cần Sử Dụng: ${process.form}</h4>
                        ${formActionButtons}
                    </div>

                    <div class="p-4 bg-white rounded-xl shadow-lg border-l-4 border-green-500">
                        <h4 class="text-xl font-bold text-green-700 mb-3 flex items-center"><i class="fa-solid fa-arrow-right-arrow-left mr-2"></i> Lưu Trình Ký Duyệt</h4>
                        <div class="bg-green-50 p-3 rounded-lg border border-green-200">
                            <p class="text-lg font-bold text-green-800">${process.process}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderFreewareDetails() {
            const freeware = freewareLists.find(f => f.id === selectedFreewareId);
            if (!freeware) {
                detailsPaneElement.innerHTML = '<p class="text-gray-500 italic">Không tìm thấy thông tin tài liệu.</p>';
                return;
            }

            detailsPaneElement.innerHTML = `
                <button onclick="appState = 5; renderRightPane();" class="mb-6 text-teal-600 hover:text-teal-800 font-semibold transition duration-200 flex items-center p-2 rounded-lg bg-white shadow-sm hover:shadow-md">
                    <i class="fa-solid fa-chevron-left mr-2 text-sm"></i> Quay lại Danh sách Freeware
                </button>

                <div class="mb-6 pb-3 border-b-2 border-teal-400">
                    <p class="text-3xl font-extrabold text-teal-800 flex items-center">
                        <i class="fa-solid fa-list-ul mr-3"></i> ${freeware.name}
                    </p>
                </div>
                
                <div class="space-y-6">
                    <div class="p-4 bg-white rounded-xl shadow-lg border-l-4 border-indigo-500">
                        <h4 class="text-xl font-bold text-indigo-700 mb-3 flex items-center"><i class="fa-solid fa-file-invoice mr-2"></i> Tên Tài Liệu: ${freeware.form}</h4>
                        <div class="flex flex-col space-y-3 mt-4">
                            <button onclick="showConfirmationModal('${freeware.formPdfUrl}', '${freeware.form}', false)" 
                                    class="w-full text-lg font-bold text-white bg-teal-600 hover:bg-teal-700 transition duration-200 shadow-md flex items-center justify-center py-3 px-4 rounded-lg">
                                <i class="fa-solid fa-file-pdf mr-3"></i> Xem hoặc Tải xuống Tài Liệu (PDF)
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.onload = function() {
            infraExpanded = true;
            selectedOperator = 'operator1';
            appState = 1;
            renderLeftPane();
            renderRightPane();
        }
    </script>
</body>
</html>
